<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vidhiora | Certificate Admin</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #17233c;
    min-height: 100vh;
    padding: 40px 20px;
}

.container {
    max-width: 650px;
    margin: auto;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 15px 45px rgba(30,55,100,.10);
}

.brand {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    color: #1647b8;
}

.subtitle {
    text-align: center;
    color: #697589;
    margin: 8px 0 30px;
}

label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    margin: 18px 0 8px;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 1px solid #d7deea;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #1647b8;
}

.certificate-id {
    margin-top: 10px;
    padding: 16px;
    background: #edf3ff;
    border: 1px solid #d5e2ff;
    border-radius: 10px;
    color: #1647b8;
    font-weight: 800;
    text-align: center;
    font-size: 17px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #1647b8;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

button:hover {
    background: #103b9d;
}

button:disabled {
    opacity: .7;
    cursor: wait;
}

.logout {
    background: #c62828;
    margin-top: 12px;
}

.message {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    text-align: center;
    font-weight: 600;
}

.success {
    background: #effaf4;
    color: #16804b;
}

.error {
    background: #fff4f4;
    color: #c62828;
}

#loginSection,
#adminSection {
    display: none;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="brand">
VIDHIORA
</div>

<div class="subtitle">
Certificate Administration
</div>


<!-- LOGIN -->

<div id="loginSection">

<label>
Email
</label>

<input
    type="email"
    id="loginEmail"
    placeholder="Admin email"
>

<label>
Password
</label>

<input
    type="password"
    id="loginPassword"
    placeholder="Password"
>

<button onclick="login()">
LOGIN
</button>

<div id="loginMessage"></div>

</div>


<!-- ADMIN -->

<div id="adminSection">

<form id="certificateForm">


<label>
Certificate Type
</label>

<select id="certificateType" required>

<option value="">
Select Certificate Type
</option>

<option value="CERTIFICATE OF APPRECIATION">
Certificate of Appreciation
</option>

<option value="CERTIFICATE OF PARTICIPATION">
Certificate of Participation
</option>

<option value="CERTIFICATE OF EXCELLENCE">
Certificate of Excellence
</option>

<option value="INTERNSHIP CERTIFICATE">
Internship Certificate
</option>

<option value="VOLUNTEER CERTIFICATE">
Volunteer Certificate
</option>

<option value="JUDGE/COORDINATOR">
Judge/Coordinator
</option>

<option value="HOST CERTIFICATE">
Host Certificate
</option>

<option value="BEST PERFORMER">
Best Performer
</option>

<option value="BEST SPEAKER">
Best Speaker
</option>

<option value="ACTIVE MEMBER">
Active Member
</option>

<option value="MEMENTO/TOKEN OF APPRECIATION">
Memento/Token of Appreciation
</option>

</select>


<label>
Generated Certificate ID
</label>

<div
    id="generatedId"
    class="certificate-id"
>
Select certificate type
</div>


<label>
Recipient Name
</label>

<input
    type="text"
    id="recipientName"
    placeholder="Recipient name"
    required
>


<label>
Event Name
</label>

<input
    type="text"
    id="eventName"
    placeholder="Event name"
    required
>


<label>
Recipient Role
</label>

<input
    type="text"
    id="recipientRole"
    placeholder="Participant / Host / Judge"
    required
>


<label>
Issue Date
</label>

<input
    type="date"
    id="issueDate"
    required
>


<label>
Status
</label>

<select id="status">

<option value="VALID">
VALID
</option>

</select>


<button
    type="submit"
    id="addButton"
>
ADD CERTIFICATE
</button>


</form>

<div id="message"></div>


<button
    class="logout"
    onclick="logout()"
>
LOGOUT
</button>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://ixytbjxucljmfogcydvf.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_K9Ei75rMUQZ_bwk7NrRu0A_mhhfUJ9N";


const headers = {

    "Content-Type":
        "application/json",

    "apikey":
        SUPABASE_PUBLISHABLE_KEY

};


/* LOGIN */

async function login() {

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;

    const message =
        document.getElementById(
            "loginMessage"
        );

    try {

        const response =
            await fetch(
                `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                {
                    method: "POST",

                    headers: headers,

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error_description ||
                data.msg ||
                "Login failed"
            );

        }

        localStorage.setItem(
            "supabase_access_token",
            data.access_token
        );

        showAdmin();

    }

    catch (error) {

        message.textContent =
            "✕ " + error.message;

        message.className =
            "message error";

    }

}


/* SHOW ADMIN */

function showAdmin() {

    document.getElementById(
        "loginSection"
    ).style.display = "none";

    document.getElementById(
        "adminSection"
    ).style.display = "block";

}


/* CHECK LOGIN */

function checkLogin() {

    const token =
        localStorage.getItem(
            "supabase_access_token"
        );

    if (token) {

        showAdmin();

    } else {

        document.getElementById(
            "loginSection"
        ).style.display = "block";

    }

}


/* GENERATE ID */

async function generateCertificateId() {

    const type =
        document.getElementById(
            "certificateType"
        ).value;

    const date =
        document.getElementById(
            "issueDate"
        ).value;

    const display =
        document.getElementById(
            "generatedId"
        );

    if (!type || !date) {

        display.textContent =
            "Select certificate type and issue date";

        return;

    }

    const year =
        new Date(date).getFullYear();

    const token =
        localStorage.getItem(
            "supabase_access_token"
        );

    if (!token) {

        display.textContent =
            "Please login first";

        return;

    }

    display.textContent =
        "Generating ID...";

    try {

        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/rpc/generate_certificate_id`,
                {
                    method: "POST",

                    headers: {
                        ...headers,

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({

                        p_certificate_type:
                            type,

                        p_year:
                            year

                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                JSON.stringify(data)
            );

        }

        display.textContent =
            data;

        display.dataset.id =
            data;

    }

    catch (error) {

        console.error(error);

        display.textContent =
            "Unable to generate ID";

    }

}


/* TYPE CHANGE */

document.getElementById(
    "certificateType"
).addEventListener(
    "change",
    generateCertificateId
);


/* DATE CHANGE */

document.getElementById(
    "issueDate"
).addEventListener(
    "change",
    generateCertificateId
);


/* ADD CERTIFICATE */

document.getElementById(
    "certificateForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const token =
            localStorage.getItem(
                "supabase_access_token"
            );

        const certificateId =
            document.getElementById(
                "generatedId"
            ).dataset.id;

        if (!certificateId) {

            alert(
                "Please select certificate type and issue date first."
            );

            return;

        }

        const button =
            document.getElementById(
                "addButton"
            );

        const message =
            document.getElementById(
                "message"
            );

        const certificate = {

            certificate_id:
                certificateId,

            recipient_name:
                document.getElementById(
                    "recipientName"
                ).value.trim(),

            certificate_type:
                document.getElementById(
                    "certificateType"
                ).value,

            event_name:
                document.getElementById(
                    "eventName"
                ).value.trim(),

            recipient_role:
                document.getElementById(
                    "recipientRole"
                ).value.trim(),

            issue_date:
                document.getElementById(
                    "issueDate"
                ).value,

            status:
                document.getElementById(
                    "status"
                ).value

        };


        button.disabled = true;

        button.textContent =
            "ADDING...";


        try {

            const response =
                await fetch(
                    `${SUPABASE_URL}/rest/v1/certificates`,
                    {
                        method: "POST",

                        headers: {

                            ...headers,

                            "Authorization":
                                `Bearer ${token}`,

                            "Prefer":
                                "return=minimal"

                        },

                        body:
                            JSON.stringify(
                                certificate
                            )

                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    errorText
                );

            }


            message.textContent =
                "✓ Certificate added successfully! ID: " +
                certificateId;

            message.className =
                "message success";


            document.getElementById(
                "certificateForm"
            ).reset();


            document.getElementById(
                "generatedId"
            ).textContent =
                "Select certificate type";

            delete document.getElementById(
                "generatedId"
            ).dataset.id;

        }

        catch (error) {

            console.error(error);

            message.textContent =
                "✕ Unable to add certificate.";

            message.className =
                "message error";

        }

        finally {

            button.disabled = false;

            button.textContent =
                "ADD CERTIFICATE";

        }

    }
);


/* LOGOUT */

function logout() {

    localStorage.removeItem(
        "supabase_access_token"
    );

    location.reload();

}


checkLogin();

</script>

</body>
</html>
